worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # ── Upstream pool: Round Robin (default) ──────────────────────
    upstream api_nodes {
        server api-node-1:3000 max_fails=3 fail_timeout=10s;
        server api-node-2:3000 max_fails=3 fail_timeout=10s;
    }

    # ── Logging ───────────────────────────────────────────────────
    log_format main '$remote_addr - [$time_local] '
                    '"$request" $status '
                    'upstream: $upstream_addr';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── Server block ──────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Active health check endpoint exposed by each API node
        location /health {
            proxy_pass         http://api_nodes;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
        }

        # All other traffic → load-balanced API nodes
        location / {
            proxy_pass         http://api_nodes;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   Connection        "";

            # Timeout settings
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
            proxy_send_timeout    30s;

            # Retry on the next node if the current one is down
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }
    }
}
