version: "3.8"

services:
  mysql-master:
    image: mysql:8.0
    container_name: mysql-master
    restart: unless-stopped
    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-do-db=productsdb
      - --sync-binlog=1
      - --innodb-flush-log-at-trx-commit=1
      - --binlog-expire-logs-seconds=604800
      - --bind-address=0.0.0.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: productsdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
    ports:
      - "3306:3306"
    volumes:
      - mysql-master-data:/var/lib/mysql
      - ./mysql/init/init-master.sql:/docker-entrypoint-initdb.d/init-master.sql:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mysql-slave:
    image: mysql:8.0
    container_name: mysql-slave
    restart: unless-stopped
    command:
      - --server-id=2
      - --relay-log=relay-bin
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --replicate-do-db=productsdb
      - --bind-address=0.0.0.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: productsdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
    ports:
      - "3307:3306"
    volumes:
      - mysql-slave-data:/var/lib/mysql
      - ./mysql/init/init-slave.sql:/docker-entrypoint-initdb.d/init-slave.sql:ro
    networks:
      - backend
    depends_on:
      mysql-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  replication-setup:
    image: mysql:8.0
    container_name: replication-setup
    restart: "no"
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
    volumes:
      - ./mysql/init/setup-replication.sh:/setup-replication.sh:ro
    networks:
      - backend
    depends_on:
      mysql-master:
        condition: service_healthy
      mysql-slave:
        condition: service_healthy
    entrypoint: ["bash", "/setup-replication.sh"]

  api-node-1:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: api-node-1
    restart: unless-stopped
    environment:
      NODE_ID: api-node-1
      MASTER_HOST: mysql-master
      SLAVE_HOST: mysql-slave
      DB_PORT: 3306
      DB_USER: appuser
      DB_PASSWORD: apppass
      DB_NAME: productsdb
      PORT: 3000
    networks:
      - backend
    depends_on:
      mysql-master:
        condition: service_healthy
      mysql-slave:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  api-node-2:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: api-node-2
    restart: unless-stopped
    environment:
      NODE_ID: api-node-2
      MASTER_HOST: mysql-master
      SLAVE_HOST: mysql-slave
      DB_PORT: 3306
      DB_USER: appuser
      DB_PASSWORD: apppass
      DB_NAME: productsdb
      PORT: 3000
    networks:
      - backend
    depends_on:
      mysql-master:
        condition: service_healthy
      mysql-slave:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  backend:
    driver: bridge

volumes:
  mysql-master-data:
  mysql-slave-data: