version: "3.8"

services:
  # ─── Database Layer ───────────────────────────────────────────────
  mysql-master:
    image: mysql:8.0
    container_name: mysql-master
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: productsdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
    ports:
      - "3306:3306"
    volumes:
      - mysql-master-data:/var/lib/mysql
      - ./mysql/master/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ./mysql/init/init-master.sql:/docker-entrypoint-initdb.d/init-master.sql:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mysql-slave:
    image: mysql:8.0
    container_name: mysql-slave
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: productsdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
    ports:
      - "3307:3306"
    volumes:
      - mysql-slave-data:/var/lib/mysql
      - ./mysql/slave/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ./mysql/init/init-slave.sql:/docker-entrypoint-initdb.d/init-slave.sql:ro
    networks:
      - backend
    depends_on:
      mysql-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Runs once to wire the slave to the master
  replication-setup:
    image: mysql:8.0
    container_name: replication-setup
    restart: "no"
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
    volumes:
      - ./mysql/init/setup-replication.sh:/setup-replication.sh:ro
    networks:
      - backend
    depends_on:
      mysql-master:
        condition: service_healthy
      mysql-slave:
        condition: service_healthy
    entrypoint: ["bash", "/setup-replication.sh"]

networks:
  backend:
    driver: bridge

volumes:
  mysql-master-data:
  mysql-slave-data: